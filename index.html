
<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>新兴市场营销日历</title>
<style>
  :root {
    --bg: #faf9f7;
    --surface: #fff;
    --border: #e5e2de;
    --border-strong: #d4d0ca;
    --text: #1a1a1a;
    --text2: #6b6b6b;
    --text3: #999;
    --accent: #1a1a1a;
    --radius: 4px;
    --radius-lg: 8px;
    --cat-promo: #EF4444; --cat-cultural: #F97316; --cat-social: #3B82F6;
    --cat-entertainment: #F59E0B; --cat-industry: #8B5CF6; --cat-national: #10B981; --cat-religious: #64748B;
    --sea: #F59E0B; --mena: #EF4444; --latam: #8B5CF6; --africa: #10B981;
    --europe: #3B82F6; --asia: #EC4899; --namerica: #14B8A6;
    --global: #6366F1; --pacific: #A78BFA; --southasia: #F97316;
    --promo: #10B981; --follow: #F59E0B; --avoid: #EF4444;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  body{font-family:'Helvetica Neue',Helvetica,Arial,'PingFang SC','Noto Sans SC',sans-serif;background:var(--bg);color:var(--text);min-height:100vh}

  /* Layout */
  .app{display:flex;max-width:1400px;margin:0 auto;min-height:100vh}
  .sidebar{width:260px;background:var(--surface);border-right:1px solid var(--border);padding:32px 24px;position:sticky;top:0;height:100vh;overflow-y:auto;flex-shrink:0}
  .main{flex:1;padding:40px 48px;min-width:0}

  /* Sidebar */
  .logo{font-size:28px;font-weight:800;letter-spacing:0;margin-bottom:4px}
  .logo-sub{font-size:11px;color:var(--text3);text-transform:uppercase;letter-spacing:0;margin-bottom:32px}
  .copyright{font-size:10px;color:var(--text3);margin-top:auto;padding-top:24px;letter-spacing:.3px}

  .filter-group{margin-bottom:24px}
  .filter-label{font-size:10px;text-transform:uppercase;letter-spacing:1.5px;color:var(--text3);font-weight:600;margin-bottom:8px}
  select, input[type=text]{width:100%;background:var(--bg);border:1px solid var(--border);color:var(--text);padding:10px 12px;font-size:13px;outline:none;transition:border-color .15s;margin-bottom:8px}
  select:focus, input:focus{border-color:var(--text2)}
  input[type=text]{margin-bottom:0}

  /* Suitability signal bars on calendar cards */
  .si{display:inline-flex;align-items:flex-end;gap:1px;height:10px;margin-right:4px;vertical-align:middle;flex-shrink:0}
  .si-bar{width:3px;border-radius:1px}
  .si-promo .si-bar{background:var(--promo)}.si-follow .si-bar{background:var(--follow)}.si-avoid .si-bar{background:var(--avoid)}
  .si-promo .si-bar.off{background:var(--promo);opacity:.18}
  .si-follow .si-bar.off{background:var(--follow);opacity:.18}
  .si-avoid .si-bar.off{background:var(--avoid);opacity:.18}

  /* Suit legend in sidebar - signal bar style */
  .suit-list{display:flex;flex-direction:column;gap:4px}
  .suit-row{display:flex;align-items:center;gap:8px;font-size:12px;cursor:pointer;padding:4px 8px;border-radius:4px;transition:background .15s}
  .suit-row:hover{background:rgba(0,0,0,.03)}
  .suit-row.active{background:rgba(0,0,0,.06)}
  .suit-icon-legend{display:inline-flex;align-items:flex-end;gap:1.5px;height:14px;flex-shrink:0;width:18px;justify-content:center}
  .suit-icon-legend .si-bar{width:4px;border-radius:1px}
  .suit-icon-legend.si-promo .si-bar{background:var(--promo)}.suit-icon-legend.si-follow .si-bar{background:var(--follow)}.suit-icon-legend.si-avoid .si-bar{background:var(--avoid)}.suit-icon-legend.si-all .si-bar{background:var(--text3)}
  .suit-icon-legend.si-promo .si-bar.off{opacity:.18}.suit-icon-legend.si-follow .si-bar.off{opacity:.18}.suit-icon-legend.si-avoid .si-bar.off{opacity:.18}.suit-icon-legend.si-all .si-bar.off{opacity:.18}

  /* Region legend */
  .region-list{display:flex;flex-direction:column;gap:4px}
  .region-row{display:flex;align-items:center;gap:8px;font-size:12px;cursor:pointer;padding:4px 8px;border-radius:4px;transition:background .15s}
  .region-row:hover{background:rgba(0,0,0,.03)}
  .region-row.active{background:rgba(0,0,0,.06)}
  .region-emoji{font-size:14px;flex-shrink:0;width:18px;text-align:center}

  /* Type legend */
  .type-list{display:flex;flex-direction:column;gap:4px}
  .type-row{display:flex;align-items:center;gap:8px;font-size:12px;cursor:pointer;padding:4px 8px;border-radius:4px;transition:background .15s}
  .type-row:hover{background:rgba(0,0,0,.03)}
  .type-row.active{background:rgba(0,0,0,.06)}
  .type-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}

  /* Header area */
  .top-bar{display:flex;align-items:center;justify-content:space-between;margin-bottom:32px;gap:24px}
  .month-display{flex:1}
  .month-year{font-size:11px;text-transform:uppercase;letter-spacing:2px;color:var(--text3);font-weight:600;margin-bottom:4px}
  .month-name{font-size:72px;font-weight:900;line-height:.9;letter-spacing:-2px;text-transform:uppercase}
  .month-desc{font-size:14px;color:var(--text2);margin-top:12px;max-width:600px;line-height:1.5;white-space:nowrap}
  .nav-controls{display:flex;align-items:center;gap:8px;margin-top:8px}
  .nav-btn{background:var(--surface);border:1px solid var(--border);color:var(--text);width:36px;height:36px;font-size:16px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .15s}
  .nav-btn:hover{background:var(--text);color:#fff;border-color:var(--text)}
  .nav-btn.disabled{opacity:.3;cursor:default;pointer-events:none}

  /* Month strip */
  .month-strip{display:flex;gap:4px;align-items:center;flex:1;flex-wrap:wrap}
  .month-year-label{font-size:11px;color:var(--text3);letter-spacing:2px;font-weight:600;margin-right:8px}
  .month-chip{font-size:11px;padding:5px 12px;border-radius:20px;cursor:pointer;transition:all .15s;background:transparent;border:1px solid transparent;color:var(--text3);font-family:inherit;letter-spacing:.5px}
  .month-chip:hover{background:var(--bg);color:var(--text2);border-color:var(--border)}
  .month-chip.active{background:var(--text);color:#fff;border-color:var(--text)}
  .month-chip.has-events{font-weight:600}

  .view-toggle{display:flex;gap:0}
  .view-btn{background:var(--surface);border:1px solid var(--border);color:var(--text2);padding:6px 14px;cursor:pointer;font-size:11px;text-transform:uppercase;letter-spacing:1px;transition:all .15s}
  .view-btn:first-child{border-right:none}
  .view-btn.active{background:var(--text);color:#fff;border-color:var(--text)}

  /* Calendar Grid */
  .cal-grid{display:grid;grid-template-columns:repeat(7,1fr);border-top:1px solid var(--border-strong);border-left:1px solid var(--border-strong);border-radius:var(--radius-lg);overflow:hidden}
  .cal-head{text-align:left;font-size:10px;text-transform:uppercase;letter-spacing:1.5px;color:var(--text3);padding:10px 12px;font-weight:600;border-right:1px solid var(--border-strong);border-bottom:1px solid var(--border-strong);background:var(--bg)}
  .cal-cell{background:var(--surface);border-right:1px solid var(--border-strong);border-bottom:1px solid var(--border-strong);min-height:140px;padding:10px 12px 12px;cursor:default;position:relative;transition:background .15s}
  .cal-cell:hover{background:#f5f4f2}
  .cal-cell.empty{background:var(--bg)}
  .cal-cell.today{background:#fffbeb}
  .cal-date{font-size:13px;font-weight:700;color:var(--text);margin-bottom:8px}
  .cal-cell.today .cal-date{color:#b8860b}
  .cal-events{display:flex;flex-direction:column;gap:6px}

  /* Event card in calendar */
  .cal-event{padding:8px 10px;border-left:3px solid transparent;cursor:pointer;transition:all .15s;background:var(--bg);position:relative;border-radius:var(--radius)}
  .cal-event:hover{transform:translateY(-1px);box-shadow:0 2px 8px rgba(0,0,0,.08)}
  .cal-event .ce-name{font-size:11px;font-weight:600;line-height:1.3;margin-bottom:2px;display:block}
  .cal-event .ce-name-en{font-size:10px;color:var(--text2);line-height:1.3;margin-bottom:2px;display:block}
  .cal-event .ce-country{font-size:9px;color:var(--text3);line-height:1.2;display:block}

  .cal-event.cat-promo{border-left-color:var(--cat-promo)}
  .cal-event.cat-cultural{border-left-color:var(--cat-cultural)}
  .cal-event.cat-social{border-left-color:var(--cat-social)}
  .cal-event.cat-entertainment{border-left-color:var(--cat-entertainment)}
  .cal-event.cat-industry{border-left-color:var(--cat-industry)}
  .cal-event.cat-national{border-left-color:var(--cat-national)}
  .cal-event.cat-religious{border-left-color:var(--cat-religious)}

  .cal-more{font-size:10px;color:var(--text3);padding:4px 0;cursor:pointer;text-transform:uppercase;letter-spacing:1px}
  .cal-more:hover{color:var(--text)}

  /* Timeline */
  .timeline{display:flex;flex-direction:column;gap:0;border-top:1px solid var(--border-strong);border-radius:var(--radius-lg);overflow:hidden}
  .tl-item{display:flex;gap:0;padding:0;background:var(--surface);cursor:pointer;transition:background .15s;align-items:stretch;border-bottom:1px solid var(--border)}
  .tl-item:hover{background:#f5f4f2}
  .tl-item.cat-promo{border-left:4px solid var(--cat-promo)}.tl-item.cat-cultural{border-left:4px solid var(--cat-cultural)}.tl-item.cat-social{border-left:4px solid var(--cat-social)}.tl-item.cat-entertainment{border-left:4px solid var(--cat-entertainment)}.tl-item.cat-industry{border-left:4px solid var(--cat-industry)}.tl-item.cat-national{border-left:4px solid var(--cat-national)}.tl-item.cat-religious{border-left:4px solid var(--cat-religious)}
  .tl-date{min-width:80px;text-align:center;padding:16px 12px;border-right:1px solid var(--border);display:flex;flex-direction:column;align-items:center;justify-content:center}
  .tl-date-day{font-size:28px;font-weight:800;line-height:1}
  .tl-body{flex:1;min-width:0;padding:14px 16px}
  .tl-title{font-size:14px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;margin-bottom:3px}
  .tl-meta{font-size:12px;color:var(--text2);margin-bottom:6px}
  .tl-badges{display:flex;gap:6px;margin-bottom:8px;flex-wrap:wrap}
  .tl-badge{display:inline-block;font-size:9px;text-transform:uppercase;letter-spacing:1px;padding:3px 8px;border:1px solid var(--border);background:#fff;border-radius:20px}
  .tl-badge.r-SEA{border-color:var(--sea);color:var(--sea)}.tl-badge.r-MENA{border-color:var(--mena);color:var(--mena)}.tl-badge.r-LATAM{border-color:var(--latam);color:var(--latam)}.tl-badge.r-Africa{border-color:var(--africa);color:var(--africa)}.tl-badge.r-Europe{border-color:var(--europe);color:var(--europe)}.tl-badge.r-Asia{border-color:var(--asia);color:var(--asia)}.tl-badge.r-NorthAmerica{border-color:var(--namerica);color:var(--namerica)}.tl-badge.r-Global{border-color:var(--global);color:var(--global)}.tl-badge.r-Pacific{border-color:var(--pacific);color:var(--pacific)}.tl-badge.r-SouthAsia{border-color:var(--southasia);color:var(--southasia)}
  .tl-badge.type-badge{border-color:var(--border-strong);color:var(--text2)}
  .tl-badge.cat-promo{border-color:var(--cat-promo);color:var(--cat-promo);font-weight:700}
  .tl-badge.cat-cultural{border-color:var(--cat-cultural);color:var(--cat-cultural);font-weight:700}
  .tl-badge.cat-social{border-color:var(--cat-social);color:var(--cat-social);font-weight:700}
  .tl-badge.cat-entertainment{border-color:var(--cat-entertainment);color:var(--cat-entertainment);font-weight:700}
  .tl-badge.cat-industry{border-color:var(--cat-industry);color:var(--cat-industry);font-weight:700}
  .tl-badge.cat-national{border-color:var(--cat-national);color:var(--cat-national);font-weight:700}
  .tl-badge.cat-religious{border-color:var(--cat-religious);color:var(--cat-religious);font-weight:700}
  .tl-badge.suit-promo{border-color:var(--promo);color:var(--promo);font-weight:700}
  .tl-badge.suit-follow{border-color:var(--follow);color:var(--follow);font-weight:700}
  .tl-badge.suit-avoid{border-color:var(--avoid);color:var(--avoid);font-weight:700}
  .tl-expand{font-size:11px;text-transform:uppercase;letter-spacing:1px;color:var(--text2);margin-top:6px;cursor:pointer;display:inline-block;padding:4px 0}
  .tl-expand:hover{color:var(--text);text-decoration:underline}
  .tl-detail{display:none;margin-top:10px;padding:14px 16px;background:var(--bg);border:1px solid var(--border)}
  .tl-detail.show{display:block}
  .tl-detail h4{font-size:10px;text-transform:uppercase;letter-spacing:1.5px;font-weight:700;margin-bottom:6px;color:var(--text)}
  .tl-detail p{font-size:12px;color:var(--text2);line-height:1.7}
  .tl-platforms{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
  .tl-platform{font-size:10px;text-transform:uppercase;letter-spacing:1px;padding:3px 10px;border:1px solid var(--border);background:#fff;border-radius:20px}
  .mt-tags{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
  .mt-tag{font-size:10px;padding:3px 10px;border:1px solid var(--border);background:#fff;color:var(--text2);border-radius:20px}

  /* Side Panel */
  .panel-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.2);z-index:100;backdrop-filter:blur(2px)}
  .panel-overlay.show{display:block}
  .panel{position:fixed;top:0;right:0;width:420px;height:100vh;background:var(--surface);border-left:1px solid var(--border-strong);z-index:101;overflow-y:auto;padding:32px;transform:translateX(100%);transition:transform .3s ease}
  .panel.show{transform:translateX(0)}
  .panel-close{position:absolute;top:20px;right:24px;background:none;border:none;color:var(--text3);font-size:24px;cursor:pointer;width:36px;height:36px;display:flex;align-items:center;justify-content:center}
  .panel-close:hover{color:var(--text)}
  .panel h2{font-size:22px;font-weight:800;text-transform:uppercase;letter-spacing:-.5px;margin-bottom:4px;padding-right:40px}
  .panel .panel-sub{font-size:12px;color:var(--text2);margin-bottom:24px;text-transform:uppercase;letter-spacing:1px}
  .panel-section{margin-bottom:20px;padding-bottom:20px;border-bottom:1px solid var(--border)}
  .panel-section:last-child{border-bottom:none}
  .panel-label{font-size:10px;text-transform:uppercase;letter-spacing:1.5px;color:var(--text3);font-weight:700;margin-bottom:6px}
  .panel-value{font-size:14px;color:var(--text);line-height:1.5}
  .panel-badges{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
  .panel-badge{display:inline-block;font-size:10px;text-transform:uppercase;letter-spacing:1px;padding:4px 10px;border:1px solid var(--border);border-radius:20px}
  .panel-badge.r-SEA{border-color:var(--sea);color:var(--sea)}.panel-badge.r-MENA{border-color:var(--mena);color:var(--mena)}.panel-badge.r-LATAM{border-color:var(--latam);color:var(--latam)}.panel-badge.r-Africa{border-color:var(--africa);color:var(--africa)}.panel-badge.r-Europe{border-color:var(--europe);color:var(--europe)}.panel-badge.r-Asia{border-color:var(--asia);color:var(--asia)}.panel-badge.r-NorthAmerica{border-color:var(--namerica);color:var(--namerica)}.panel-badge.r-Global{border-color:var(--global);color:var(--global)}.panel-badge.r-Pacific{border-color:var(--pacific);color:var(--pacific)}.panel-badge.r-SouthAsia{border-color:var(--southasia);color:var(--southasia)}
  .panel-badge.type-badge{border-color:var(--border-strong);color:var(--text2)}
  .panel-badge.cat-promo{border-color:var(--cat-promo);color:var(--cat-promo);font-weight:700}
  .panel-badge.cat-cultural{border-color:var(--cat-cultural);color:var(--cat-cultural);font-weight:700}
  .panel-badge.cat-social{border-color:var(--cat-social);color:var(--cat-social);font-weight:700}
  .panel-badge.cat-entertainment{border-color:var(--cat-entertainment);color:var(--cat-entertainment);font-weight:700}
  .panel-badge.cat-industry{border-color:var(--cat-industry);color:var(--cat-industry);font-weight:700}
  .panel-badge.cat-national{border-color:var(--cat-national);color:var(--cat-national);font-weight:700}
  .panel-badge.cat-religious{border-color:var(--cat-religious);color:var(--cat-religious);font-weight:700}
  .panel-badge.suit-promo{border-color:var(--promo);color:var(--promo);font-weight:700}
  .panel-badge.suit-follow{border-color:var(--follow);color:var(--follow);font-weight:700}
  .panel-badge.suit-avoid{border-color:var(--avoid);color:var(--avoid);font-weight:700}
  .panel-tip{background:var(--bg);padding:14px 16px;border-left:3px solid var(--text);margin-top:12px;border-radius:var(--radius)}
  .panel-tip.promo{border-left-color:var(--promo)}
  .panel-tip.follow{border-left-color:var(--follow)}
  .panel-tip.avoid{border-left-color:var(--avoid)}
  .panel-tip h4{font-size:10px;text-transform:uppercase;letter-spacing:1.5px;margin-bottom:6px;font-weight:700}
  .panel-tip p{font-size:13px;color:var(--text2);line-height:1.7}
  .panel-platforms{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
  .pp-card{font-size:10px;padding:4px 10px;border:1px solid var(--border);background:#fff;border-radius:20px}
  .pp-card .pp-name{font-weight:700}.pp-card .pp-region{color:var(--text3);font-size:10px;margin-left:4px}
  .panel-template{margin-top:16px}
  .panel-template h4{font-size:10px;text-transform:uppercase;letter-spacing:1.5px;font-weight:700;margin-bottom:8px}
  .pt-row{margin-bottom:10px}
  .pt-label{font-size:10px;text-transform:uppercase;letter-spacing:1px;color:var(--text3);margin-bottom:3px}
  .pt-tags{display:flex;gap:6px;flex-wrap:wrap}
  .pt-tag{font-size:10px;padding:3px 10px;border:1px solid var(--border);background:#fff;color:var(--text2);border-radius:20px}
  .panel-notes{margin-top:20px}
  .panel-notes textarea{width:100%;min-height:80px;border:1px solid var(--border);padding:12px;font-size:13px;font-family:inherit;resize:vertical;background:var(--bg);color:var(--text);outline:none;border-radius:var(--radius)}
  .panel-notes textarea:focus{border-color:var(--text2)}

  /* Responsive */
  @media(max-width:1024px){
    .app{flex-direction:column}
    .sidebar{width:100%;height:auto;position:static;border-right:none;border-bottom:1px solid var(--border);padding:20px}
    .main{padding:24px}
    .month-name{font-size:48px}
    .panel{width:100%}
  }
  @media(max-width:768px){
    .cal-cell{min-height:100px;padding:8px}
    .cal-event .ce-desc{display:none}
    .cal-event .ce-cta{display:none}
    .month-name{font-size:36px}
    .top-bar{flex-direction:column}
  }
</style>
</head>
<body>
<div class="app">
  <!-- Sidebar -->
  <div class="sidebar">
    <div class="logo">CALENDAR</div>
    <div class="logo-sub">Emerging Market</div>

    <div class="filter-group">
      <div class="filter-label">Search</div>
      <input type="text" id="searchInput" placeholder="搜索节日、国家..." />
    </div>

    <div class="filter-group">
      <div class="filter-label">节日类别</div>
      <div class="type-list">
        <div class="type-row active" data-type="all" onclick="setType('all')"><div class="type-dot" style="background:var(--text3)"></div><span>全部类别</span></div>
        <div class="type-row" data-type="promo" onclick="setType('promo')"><div class="type-dot" style="background:var(--cat-promo)"></div><span>商业促销</span></div>
        <div class="type-row" data-type="cultural" onclick="setType('cultural')"><div class="type-dot" style="background:var(--cat-cultural)"></div><span>文化传统</span></div>
        <div class="type-row" data-type="social" onclick="setType('social')"><div class="type-dot" style="background:var(--cat-social)"></div><span>社会议题</span></div>
        <div class="type-row" data-type="entertainment" onclick="setType('entertainment')"><div class="type-dot" style="background:var(--cat-entertainment)"></div><span>娱乐流行</span></div>
        <div class="type-row" data-type="industry" onclick="setType('industry')"><div class="type-dot" style="background:var(--cat-industry)"></div><span>行业活动</span></div>
        <div class="type-row" data-type="national" onclick="setType('national')"><div class="type-dot" style="background:var(--cat-national)"></div><span>国家公共</span></div>
        <div class="type-row" data-type="religious" onclick="setType('religious')"><div class="type-dot" style="background:var(--cat-religious)"></div><span>宗教节日</span></div>
      </div>
    </div>

    <div class="filter-group">
      <div class="filter-label">地区分布</div>
      <div class="region-list">
        <div class="region-row active" data-region="all" onclick="setRegion('all')"><span class="region-emoji">🌐</span><span>全部地区</span></div>

    else if(activeRegion!=='all'&&e.region!==activeRegion)return false;
    if(activeType!=='all'&&e.category!==activeType)return false;
    if(q&&!e.name_zh.toLowerCase().includes(q)&&!e.name_en.toLowerCase().includes(q)&&!(e.tags||[]).join(' ').toLowerCase().includes(q)&&!e.description.toLowerCase().includes(q))return false;
    return true;
  });
}
function getEventsForDate(ds){return getFiltered().filter(e=>e.date===ds)}
function daysUntil(ds){const t=new Date(ds+'T00:00:00'),n=new Date();n.setHours(0,0,0,0);return Math.ceil((t-n)/864e5)}
function fmtDate(ds){if(!ds)return'';const[y,m,d]=ds.split('-');return`${+m}/${+d}`}

function setSuit(s){
  activeSuit=s;
  document.querySelectorAll('.suit-row').forEach(r=>r.classList.toggle('active',r.dataset.suit===s));
  render();
}
function setRegion(r){
  activeRegion=r;
  document.querySelectorAll('.region-row').forEach(row=>row.classList.toggle('active',row.dataset.region===r));
  render();
}
function setType(t){
  activeType=t;
  document.querySelectorAll('.type-row').forEach(row=>row.classList.toggle('active',row.dataset.type===t));
  render();
}
function setView(v){
  currentView=v;
  document.querySelectorAll('.view-btn').forEach(b=>b.classList.toggle('active',b.dataset.view===v));
  document.getElementById('calendarView').style.display=v==='calendar'?'':'none';
  document.getElementById('timelineView').style.display=v==='timeline'?'':'none';
  render();
}

function renderCalendar(){
  const g=document.getElementById('calGrid');g.innerHTML='';
  weekdays.forEach(d=>{const e=document.createElement('div');e.className='cal-head';e.textContent=d;g.appendChild(e)});
  const fd=new Date(currentYear,currentMonth,1).getDay(),dim=new Date(currentYear,currentMonth+1,0).getDate();
  const now=new Date(),ts=`${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,'0')}-${String(now.getDate()).padStart(2,'0')}`;
  for(let i=0;i<fd;i++){const e=document.createElement('div');e.className='cal-cell empty';g.appendChild(e)}
  for(let d=1;d<=dim;d++){
    const ds=`${currentYear}-${String(currentMonth+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
    const evs=getEventsForDate(ds),el=document.createElement('div');
    el.className='cal-cell'+(ds===ts?' today':'');
    el.innerHTML=`<div class="cal-date">${d}</div>`;
    const ed=document.createElement('div');ed.className='cal-events';
    const ms=2;
    function makeEventCard(ev,extra){
      const card=document.createElement('div');
      const cat=ev.category||'cultural';
      card.className=`cal-event${extra?' cal-event-extra':''} cat-${cat}`;
      const countryStr=ev.country.filter(c=>c!=='E-commerce'&&c!=='Global'&&c!=='Christian Countries'&&c!=='Islamic Countries'&&c!=='Nordic Countries'&&c!=='Multiple').map(cnCountry).join(' · ');
      card.innerHTML=`<span class="ce-name">${ev.name_zh}</span><span class="ce-country">${ev.name_en}${countryStr?' · '+countryStr:''}</span>`;
      card.onclick=e=>{e.stopPropagation();openPanel(ev)};
      return card;
    }
    evs.slice(0,ms).forEach(ev=>{ed.appendChild(makeEventCard(ev,false))});
    if(evs.length>ms){
      const m=document.createElement('div');m.className='cal-more';m.textContent=`+${evs.length-ms} 更多`;
      m.onclick=(e)=>{
        e.stopPropagation();
        if(m.dataset.expanded==='1'){
          ed.querySelectorAll('.cal-event-extra').forEach(el=>el.remove());
          m.textContent=`+${evs.length-ms} 更多`;
          m.dataset.expanded='0';
        }else{
          evs.slice(ms).forEach(ev=>{ed.insertBefore(makeEventCard(ev,true),m)});
          m.textContent='收起';
          m.dataset.expanded='1';
        }
      };
      ed.appendChild(m);
    }
    el.appendChild(ed);g.appendChild(el);
  }
}

function renderTimeline(){
  const tl=document.getElementById('timeline');tl.innerHTML='';
  const f=getFiltered().filter(e=>{const[y,m]=e.date.split('-').map(Number);return y===currentYear&&m===currentMonth+1}).sort((a,b)=>a.date.localeCompare(b.date));
  if(!f.length){tl.innerHTML='<div style="text-align:center;color:var(--text3);padding:60px;font-size:14px;text-transform:uppercase;letter-spacing:2px">当月无匹配事件</div>';return}
  f.forEach(ev=>{
    const d=new Date(ev.date),days=daysUntil(ev.date);
    const dl=days===0?'今天':days===1?'明天':days>0?days+'天后':'已过';
    const item=document.createElement('div');item.className=`tl-item cat-${ev.category||'cultural'}`;
    const platStr=(ev.platforms||[]).map(p=>`<span class="tl-platform">${p.name}</span>`).join('');
    const htStr=(ev.content_template?.hashtags||[]).map(h=>`<span class="mt-tag">${h}</span>`).join('');
    const si=ev.suitability==='promo'?'si-promo':ev.suitability==='follow'?'si-follow':'si-avoid';
    const siIcon=suitIcons[ev.suitability]?suitIcons[ev.suitability]():'';
    item.innerHTML=`
      <div class="tl-date"><div class="tl-date-day">${d.getDate()}</div></div>
      <div class="tl-body">
        <div class="tl-title">${ev.name_zh}</div>
        <div class="tl-meta">${ev.name_en} · ${ev.country.map(cnCountry).join(', ')} · <span style="color:${days<=3&&days>=0?'var(--avoid)':'var(--text3)'}">${dl}</span></div>
        <div class="tl-badges">
          <span class="tl-badge cat-${ev.category||'cultural'}">${categoryNames[ev.category]||ev.category}</span>
          <span class="tl-badge ${rc(ev.region)}">${regionNames[ev.region]||ev.region}</span>
          <span class="tl-badge suit-${ev.suitability}">${suitNames[ev.suitability]}</span>
        </div>
        <div class="tl-expand" onclick="event.stopPropagation();toggleTlDetail(this)">展开详情 ↓</div>
        <div class="tl-detail">
          <h4><span class="si ${si}" style="margin-right:6px">${siIcon}</span>营销建议</h4><p>${ev.marketing_tip||'—'}</p>
          ${platStr?`<h4 style="margin-top:10px">推荐平台</h4><div class="tl-platforms">${platStr}</div>`:''}
          ${htStr?`<h4 style="margin-top:10px">话题标签</h4><div class="mt-tags">${htStr}</div>`:''}
          ${(ev.content_template?.creative)?`<div style="margin-top:8px"><span style="font-size:10px;text-transform:uppercase;letter-spacing:1px;color:var(--text3)">素材风格</span><p style="font-size:12px;color:var(--text2);line-height:1.6;margin-top:2px">${ev.content_template.creative}</p></div>`:''}
          ${(ev.content_template?.ad_types?.length)?`<div style="margin-top:6px"><span style="font-size:10px;text-transform:uppercase;letter-spacing:1px;color:var(--text3)">推荐广告类型</span><p style="font-size:12px;color:var(--text2);line-height:1.6;margin-top:2px">${ev.content_template.ad_types.join('、')}</p></div>`:''}
        </div>
      </div>`;
    item.onclick=(e)=>{if(e.target.closest('.tl-expand'))return;toggleTlDetail(item.querySelector('.tl-expand'));};
    tl.appendChild(item);
  });
}

function openPanel(ev){
  document.getElementById('panelTitle').textContent=ev.name_zh;
  document.getElementById('panelSub').textContent=ev.date+' · '+ev.name_en;
  document.getElementById('panelRegion').className=`panel-badge ${rc(ev.region)}`;
  document.getElementById('panelRegion').textContent=regionNames[ev.region]||ev.region;
  document.getElementById('panelType').textContent=categoryNames[ev.category]||ev.category;
  document.getElementById('panelType').className=`panel-badge cat-${ev.category||'cultural'}`;
  document.getElementById('panelSuit').className=`panel-badge suit-${ev.suitability}`;
  document.getElementById('panelSuit').textContent=suitNames[ev.suitability];
  document.getElementById('panelCountry').textContent=ev.country.map(cnCountry).join(', ');
  // Duration
  let durText='';
  if(ev.start_date&&ev.end_date&&ev.start_date!==ev.end_date){
    const hasPeak=ev.peak_date&&ev.peak_date!==ev.start_date&&ev.peak_date!==ev.end_date;
    if(hasPeak){durText=`${fmtDate(ev.start_date)} → ${fmtDate(ev.peak_date)}(峰值) → ${fmtDate(ev.end_date)}`}
    else{durText=`${fmtDate(ev.start_date)} → ${fmtDate(ev.end_date)}`}
  }
  document.getElementById('panelDuration').textContent=durText||'单日节点';
  document.getElementById('panelDesc').textContent=ev.description;
  // Tip
  const tip=document.getElementById('panelTip');
  tip.className='panel-tip '+ev.suitability;
  const siIcon=suitIcons[ev.suitability]?suitIcons[ev.suitability]():'';
  const si=ev.suitability==='promo'?'si-promo':ev.suitability==='follow'?'si-follow':'si-avoid';
  document.getElementById('panelTipTitle').innerHTML=`<span class="si ${si}" style="margin-right:6px">${siIcon}</span>营销建议`;
  document.getElementById('panelTipText').textContent=ev.marketing_tip||'—';
  // Platforms
  const pp=document.getElementById('panelPlatformsSection'),pg=document.getElementById('panelPlatforms');
  if(ev.platforms&&ev.platforms.length){pp.style.display='';pg.innerHTML=ev.platforms.map(p=>`<div class="pp-card"><span class="pp-name">${p.name}</span><span class="pp-region">${p.region}</span></div>`).join('')}
  else{pp.style.display='none'}
  // Template
  const ct=document.getElementById('panelTemplateSection');
  if(ev.content_template&&(ev.content_template.hashtags?.length||ev.content_template.creative||ev.content_template.ad_types?.length)){
    ct.style.display='';
    document.getElementById('panelHashtags').innerHTML=(ev.content_template.hashtags||[]).map(h=>`<span class="pt-tag">${h}</span>`).join('');
    document.getElementById('panelCreative').textContent=ev.content_template.creative||'—';
    document.getElementById('panelAdTypes').textContent=(ev.content_template.ad_types||[]).join('、')||'—';
  }else{ct.style.display='none'}
  // Update panel sub-labels
  // Notes
  const ne=document.getElementById('panelNotes');ne.value=getNotes(ev.id);ne.onblur=()=>saveNote(ev.id,ne.value);
  document.getElementById('panelOverlay').classList.add('show');
  document.getElementById('panel').classList.add('show');
}
function closePanel(){
  document.getElementById('panelOverlay').classList.remove('show');
  document.getElementById('panel').classList.remove('show');
}

function toggleTlDetail(el){
  if(!el)return;
  const detail=el.nextElementSibling;
  if(!detail)return;
  detail.classList.toggle('show');
  el.textContent=detail.classList.contains('show')?'收起详情 ↑':'展开详情 ↓';
}

function renderMonthStrip(){
  const ms=document.getElementById('monthStrip');
  ms.innerHTML='<span class="month-year-label">'+currentYear+'</span>';
  for(let i=5;i<=11;i++){
    const m=new Date(2026,i,1);
    const hasEvents=DATA.events.some(e=>{const[y,em]=e.date.split('-').map(Number);return y===2026&&em===i+1});
    const chip=document.createElement('button');
    chip.className='month-chip'+(currentYear===2026&&currentMonth===i?' active':'')+(hasEvents?' has-events':'');
    chip.textContent=monthNames[i].slice(0,3);
    chip.onclick=()=>{currentYear=2026;currentMonth=i;render()};
    ms.appendChild(chip);
  }
}

function render(){
  renderMonthStrip();
  if(currentView==='calendar')renderCalendar();else renderTimeline();
}

// Month navigation removed — use month strip instead
document.getElementById('searchInput').oninput=render;

// Init
render();
</script>
</body>
</html>
